name: docker image pusher

on:
  workflow_dispatch:
  push:
    paths:
      - 'images.txt'

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Aliyun Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ALIYUN_REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USER }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    - name: List available tags
      run: |
        TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:langgenius/dify-plugin-daemon:pull" | jq -r '.token')
        curl -s -H "Authorization: Bearer $TOKEN" "https://registry-1.docker.io/v2/langgenius/dify-plugin-daemon/tags/list" | jq .
    - name: Pull and Push Docker Images
      run: |
        set -e
        while IFS= read -r image; do
          [[ -z "$image" ]] && continue
          echo "Processing image: $image"
          docker pull "$image"
          target_image="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/${image//\//_}"
          docker tag "$image" "$target_image"
          docker push "$target_image"
        done < images.txt
